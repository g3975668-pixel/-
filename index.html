<style>
:root{
  --paper:#EDF1EE; --card:#FBFCFB; --ink:#18211D; --soft:#5E6B64;
  --line:#DCE3DF; --green:#2E7D5B; --green-bg:#E4F0EA;
  --over:#BB4A32; --over-bg:#F7E7E1; --amber:#B07A26; --amber-bg:#F3ECDB;
  --pro:#3D5C8C; --pro-bg:#E4EAF3;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--paper); }
body{
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Hiragino Sans","Segoe UI",sans-serif;
  color:var(--ink);
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-text-size-adjust:100%;
}
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
.wrap{ max-width:520px; margin:0 auto; }
button{ font-family:inherit; }

.top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; gap:10px; }
.period{ font-size:13px; color:var(--soft); }
.period b{ color:var(--ink); font-weight:600; }
.gear{ border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:9px; padding:6px 12px; font-size:12px; cursor:pointer; flex-shrink:0; }

.banner{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--green-bg); color:var(--green); border-radius:11px;
  padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.5; }
.bx{ border:none; background:transparent; color:var(--green); font-size:16px;
  cursor:pointer; padding:0 2px; line-height:1; flex-shrink:0; }
.warn{ background:var(--over-bg); color:var(--over); border-radius:11px;
  padding:12px 14px; font-size:12.5px; margin-bottom:12px; line-height:1.6; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:12px; }
.heroLabel{ font-size:12px; color:var(--soft); letter-spacing:.04em; }
.hero{ display:flex; align-items:baseline; gap:8px; margin-top:4px; }
.heroNum{ font-size:42px; font-weight:600; line-height:1; }
.heroUnit{ font-size:15px; color:var(--soft); }
.pill{ display:inline-block; margin-top:12px; font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:20px; }
.meter{ margin-top:16px; }
.track{ position:relative; height:12px; border-radius:7px; background:var(--paper);
  border:1px solid var(--line); overflow:hidden; }
.fill{ position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; transition:width .35s ease; }
.marker{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); }
.mcap{ position:absolute; top:-13px; transform:translateX(-50%); font-size:9.5px; white-space:nowrap; }
.mlabel{ display:flex; justify-content:space-between; margin-top:9px; font-size:11px; color:var(--soft); gap:8px; }
.pace{ font-size:12px; color:var(--soft); margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
.pace b{ color:var(--ink); font-weight:600; }
.muted{ font-size:13px; color:var(--soft); margin-top:12px; line-height:1.6; }

.mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.mcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
.mcTop{ display:flex; align-items:baseline; justify-content:space-between; }
.mcLbl{ font-size:12px; font-weight:600; }
.mcDir{ font-size:10px; color:var(--soft); }
.mcNum{ font-size:25px; font-weight:600; line-height:1.1; margin-top:8px; }
.mcNum .u{ font-size:12px; color:var(--soft); font-weight:400; margin-left:3px; }
.mcTrack{ position:relative; height:7px; border-radius:5px; background:var(--paper);
  border:1px solid var(--line); overflow:hidden; margin-top:10px; }
.mcFill{ position:absolute; left:0; top:0; bottom:0; border-radius:5px 0 0 5px; transition:width .35s ease; }
.mcMark{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
.mcSt{ font-size:10.5px; margin-top:8px; font-weight:600; }
.mcSub{ font-size:10px; color:var(--soft); margin-top:3px; }

.stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:12px; }
.stat{ background:var(--card); padding:14px 10px; text-align:center; }
.statNum{ font-size:19px; font-weight:600; }
.statLbl{ font-size:10.5px; color:var(--soft); margin-top:3px; line-height:1.4; }

.h{ font-size:13px; font-weight:600; color:var(--soft); margin:22px 2px 10px; }
.hrow{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 10px; }
.hrow .h{ margin:0; }
.toggle{ border:none; background:transparent; color:var(--soft); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }

.daysel{ font-size:13px; color:var(--soft); margin:2px 0 10px; }
.daysel b{ color:var(--ink); }
.ig{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ig .full{ grid-column:1 / -1; }
.flab{ font-size:11px; color:var(--soft); margin-bottom:5px; }
.field{ width:100%; border:1px solid var(--line); border-radius:11px; background:var(--card);
  padding:12px 13px; font-size:19px; color:var(--ink); outline:none; }
.field:focus{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.saveBtn{ width:100%; border:none; background:var(--ink); color:#fff; border-radius:11px;
  padding:14px; font-size:15px; font-weight:600; cursor:pointer; margin-top:10px; }
.saveState{ font-size:11.5px; margin-top:8px; text-align:center; min-height:16px; color:var(--soft); }
.saveState.ok{ color:var(--green); }
.saveState.bad{ color:var(--over); font-weight:600; }
.ocrBtn{ width:100%; border:1px solid var(--green); background:var(--green-bg); color:var(--green);
  border-radius:11px; padding:13px; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:10px;
  display:flex; align-items:center; justify-content:center; gap:7px; }
.ocrBtn svg{ width:17px; height:17px; }
.ocrBtn.alt{ border-color:var(--pro); background:var(--pro-bg); color:var(--pro); }
.ocrNote{ background:var(--amber-bg); color:var(--amber); border-radius:10px; padding:9px 12px;
  font-size:11.5px; line-height:1.55; margin-bottom:10px; }
.ov{ position:fixed; inset:0; background:rgba(24,33,29,.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
.ovCard{ background:var(--card); border-radius:16px; padding:24px 22px; max-width:300px; width:100%; text-align:center; }
.ovTitle{ font-size:15px; font-weight:600; margin-bottom:14px; }
.ovBar{ height:8px; border-radius:5px; background:var(--paper); border:1px solid var(--line); overflow:hidden; }
.ovFill{ height:100%; width:0%; background:var(--green); border-radius:5px; transition:width .25s ease; }
.ovPct{ font-size:12px; color:var(--soft); margin-top:9px; }
.ovErr{ font-size:12.5px; color:var(--over); line-height:1.6; margin-top:4px; }
.ovClose{ margin-top:16px; border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer; }

.day{ display:block; padding:11px 14px; border:1px solid var(--line); border-radius:11px;
  background:var(--card); margin-bottom:7px; cursor:pointer; }
.day.sel{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.dayHead{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.dDate{ font-size:14px; }
.day.today .dDate{ font-weight:700; }
.dTag{ font-size:10px; color:var(--green); background:var(--green-bg); padding:2px 7px; border-radius:10px; margin-left:8px; }
.dKcal{ font-size:15px; font-weight:600; }
.dMacros{ font-size:11.5px; color:var(--soft); margin-top:6px; display:flex; flex-wrap:wrap; gap:10px; }
.dMacros .lab{ color:var(--soft); }
.dEmpty{ color:#B7C0BA; font-size:14px; }

.hist{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:8px; }
.histTop{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:13px; color:var(--soft); }
.histRow{ margin-top:9px; }
.histLbl{ display:flex; justify-content:space-between; font-size:11px; color:var(--soft); margin-bottom:4px; gap:8px; }
.histLbl b{ font-weight:600; color:var(--ink); }
.histBar{ height:5px; border-radius:3px; background:var(--paper); border:1px solid var(--line); overflow:hidden; position:relative; }
.histFill{ position:absolute; left:0; top:0; bottom:0; border-radius:3px 0 0 3px; }

.set label{ display:block; font-size:12px; color:var(--soft); margin:14px 0 6px; }
.set input{ width:100%; border:1px solid var(--line); border-radius:11px; padding:12px 14px;
  font-size:16px; color:var(--ink); background:var(--card); outline:none; }
.set input:focus{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.calc{ font-size:11.5px; color:var(--soft); margin-top:7px; min-height:15px; }
.calc b{ color:var(--ink); font-weight:600; }
.presets{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.preset{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:20px; padding:8px 14px; font-size:12.5px; cursor:pointer; }
.note{ font-size:11.5px; color:var(--soft); line-height:1.6; margin-top:16px; }
.actions{ display:flex; gap:8px; margin-top:20px; }
.btnMain{ flex:1; border:none; background:var(--ink); color:#fff; border-radius:11px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
.btnGhost{ border:1px solid var(--line); background:var(--card); color:var(--soft); border-radius:11px; padding:14px 18px; font-size:15px; cursor:pointer; }
.backup{ display:flex; gap:8px; margin-top:12px; }
.backup button{ flex:1; border:1px solid var(--line); background:var(--card); color:var(--soft); border-radius:11px; padding:11px; font-size:12.5px; cursor:pointer; }

.intro{ text-align:center; padding:12px 4px 4px; }
.intro h1{ font-size:22px; margin:0 0 6px; }
.intro p{ font-size:14px; color:var(--soft); line-height:1.6; margin:0 0 4px; }
.hint{ font-size:11.5px; color:var(--soft); text-align:center; margin-top:16px; line-height:1.6; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<input type="file" id="ocrFile" accept="image/*" style="display:none">
<input type="file" id="tblFile" accept="image/*" style="display:none">

<script>
"use strict";

/* ---------- nutrients ---------- */
/* dir: "ceiling" = 超えない上限（残り表示） / "floor" = 届かせたい下限（あと表示） */
var NUTRIENTS=[
  { id:"kcal",  label:"カロリー",   unit:"kcal", dir:"ceiling", hero:true },
  { id:"p",     label:"タンパク質", unit:"g",    dir:"floor"   },
  { id:"f",     label:"脂質",       unit:"g",    dir:"ceiling" },
  { id:"c",     label:"炭水化物",   unit:"g",    dir:"ceiling" },
  { id:"fiber", label:"食物繊維",   unit:"g",    dir:"floor"   }
];
function nutById(id){ for(var i=0;i<NUTRIENTS.length;i++) if(NUTRIENTS[i].id===id) return NUTRIENTS[i]; return null; }

/* ---------- dates ---------- */
function parseISO(s){ var a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function toISO(d){ var m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"); return d.getFullYear()+"-"+m+"-"+day; }
function stripTime(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((stripTime(b)-stripTime(a))/86400000); }
function fmtJP(d){ var w=["日","月","火","水","木","金","土"][d.getDay()]; return (d.getMonth()+1)+"/"+d.getDate()+"（"+w+"）"; }
function fmtShort(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
function fmtNum(n){ return Math.round(n).toLocaleString("ja-JP"); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* entries: old could be number or {k,p}; new is {kcal,p,f,c,fiber} */
function getVal(entry,id){
  if(entry==null) return null;
  if(typeof entry==="number") return id==="kcal"?entry:null;
  if(id==="kcal" && entry.k!=null && entry.kcal==null) return Number(entry.k); /* old */
  var v=entry[id];
  return v==null?null:Number(v);
}
function entryHasAny(entry){
  for(var i=0;i<NUTRIENTS.length;i++){ var v=getVal(entry,NUTRIENTS[i].id); if(v!=null&&v>0) return true; }
  return false;
}

/* ---------- storage ---------- */
var KEY="calorie-ledger-v4", OLD_KEY="calorie-ledger-v3";
var storageOk=true;
function probeStorage(){ try{ localStorage.setItem("__p__","1"); localStorage.removeItem("__p__"); return true; }catch(e){ return false; } }
function readState(k){ try{ var raw=localStorage.getItem(k); if(raw) return JSON.parse(raw); }catch(e){} return null; }
function writeState(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); return localStorage.getItem(KEY)!=null; }catch(e){ console.error(e); return false; } }

/* ---------- period logic ---------- */
function targetFor(cfg,id,days){ return (Number(cfg.avg&&cfg.avg[id])||0)*days; }
function summarize(cfg,entries){
  var s=parseISO(cfg.startDate), days=diffDays(s,parseISO(cfg.endDate))+1;
  var sums={}, targets={}, entered=0;
  NUTRIENTS.forEach(function(n){ sums[n.id]=0; targets[n.id]=targetFor(cfg,n.id,days); });
  for(var i=0;i<days;i++){
    var e=entries[toISO(addDays(s,i))];
    if(e){
      NUTRIENTS.forEach(function(n){ var v=getVal(e,n.id); if(v!=null) sums[n.id]+=v; });
      if(entryHasAny(e)) entered++;
    }
  }
  return { startDate:cfg.startDate, endDate:cfg.endDate, days:days, entered:entered, sums:sums, targets:targets };
}
function rollForward(){
  var today=stripTime(new Date()), rolled=0;
  while(state.config && parseISO(state.config.endDate)<today && rolled<400){
    state.history.unshift(summarize(state.config,state.entries));
    var len=diffDays(parseISO(state.config.startDate),parseISO(state.config.endDate))+1;
    var ns=addDays(parseISO(state.config.endDate),1);
    state.config={ startDate:toISO(ns), endDate:toISO(addDays(ns,len-1)), avg:state.config.avg };
    rolled++;
  }
  return rolled;
}

/* ---------- state ---------- */
var state={config:null,entries:{},history:[]};
var rolledCount=0, showHistory=false, settingsOpen=false;
var selDate=toISO(new Date()), saveMsg="", saveCls="";
var pendingInput=null, ocrNote="";

/* ---------- status for one nutrient ---------- */
function statusFor(n,sum,target,timeFrac){
  var frac=target?Math.min(sum/target,1):0;
  if(n.dir==="ceiling"){
    var over=target&&sum>target, fast=target&&frac>timeFrac&&!over;
    return {
      frac:frac, color:over?"var(--over)":(fast?"var(--amber)":"var(--green)"),
      heroNum:target?Math.abs(target-sum):sum,
      heroUnit:(over?n.unit+" 超過":n.unit),
      labelSuffix:target?"・残り":"・累計",
      pillText:over?"目標を超えています":(fast?"ペースがやや速めです":"ペース内で順調です"),
      pillBg:over?"var(--over-bg)":(fast?"var(--amber-bg)":"var(--green-bg)"),
      pillFg:over?"var(--over)":(fast?"var(--amber)":"var(--green)"),
      paceVerb:"まで", done:false
    };
  } else {
    var done=target&&sum>=target, behind=target&&frac<timeFrac&&!done;
    return {
      frac:frac, color:done?"var(--green)":(behind?"var(--amber)":"var(--pro)"),
      heroNum:target?Math.max(target-sum,0):sum,
      heroUnit:n.unit,
      labelSuffix:target?"・あと":"・累計",
      pillText:done?"目標を達成しました":(behind?"やや不足しています":"ペース内で順調です"),
      pillBg:done?"var(--green-bg)":(behind?"var(--amber-bg)":"var(--pro-bg)"),
      pillFg:done?"var(--green)":(behind?"var(--amber)":"var(--pro)"),
      paceVerb:"必要", done:done
    };
  }
}

/* ---------- setup ---------- */
function renderSetup(){
  var today=toISO(new Date()), c=state.config;
  var s=c?c.startDate:today, e=c?c.endDate:toISO(addDays(new Date(),6));
  var html="";
  if(!storageOk) html+='<div class="warn"><b>データを保存できません。</b><br>この画面を閉じると入力内容は消えます。Safariのプライベートブラウズを使っている場合は、通常のタブで開き直してください。</div>';

var tessLoading=null;

function preprocess(img,targetW){
  targetW=targetW||1080;
  var scale=targetW/img.width; if(scale>2.2) scale=2.2; if(scale<0.2) scale=0.2;
  var cw=Math.max(1,Math.round(img.width*scale)), ch=Math.max(1,Math.round(img.height*scale));
  var c=document.createElement("canvas"); c.width=cw; c.height=ch;
  var ctx=c.getContext("2d"); ctx.drawImage(img,0,0,cw,ch);
  var d=ctx.getImageData(0,0,cw,ch), p=d.data, sum=0;
  for(var i=0;i<p.length;i+=4){ var g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; p[i]=p[i+1]=p[i+2]=g; sum+=g; }
  if(sum/(p.length/4)<128){ for(var j=0;j<p.length;j+=4){ p[j]=255-p[j]; p[j+1]=255-p[j+1]; p[j+2]=255-p[j+2]; } }
  ctx.putImageData(d,0,0); return c;
}
var OCR_LABELS=[["kcal",["カロリー","カロ"]],["p",["たん","タンパク","蛋白"]],["f",["脂質"]],["c",["炭水化物","炭水"]],["fiber",["食物繊維","繊維"]]];
var OCR_SKIP=["糖質","塩分"];
/* Calomil's stylized digits are often OCR'd as circled/fullwidth numerals; map them to ASCII. */
function normDigits(s){
  var out="";
  for(var i=0;i<s.length;i++){ var code=s.charCodeAt(i);
    if(code===0x24EA){ out+="0"; continue; }                               /* circled 0 */
    if(code>=0x2460 && code<=0x2473){ out+=String(code-0x2460+1); continue; } /* circled 1..20 */
    if(code>=0xFF10 && code<=0xFF19){ out+=String(code-0xFF10); continue; }   /* fullwidth 0-9 */
    if(code===0xFF0E){ out+="."; continue; }                                 /* fullwidth . */
    if(code===0xFF0F){ out+="/"; continue; }                                 /* fullwidth / */
    out+=s[i];
  }
  return out;
}
function ocrToNum(s){ var m=normDigits(String(s)).replace(/\s/g,"").match(/\d[\d,]*\.?\d*/); return m?m[0].replace(/,/g,""):null; }
function ocrLabel(seg){
  for(var i=0;i<OCR_SKIP.length;i++) if(seg.indexOf(OCR_SKIP[i])>=0) return "SKIP";
  for(var i=0;i<OCR_LABELS.length;i++){ var subs=OCR_LABELS[i][1];
    for(var j=0;j<subs.length;j++) if(seg.indexOf(subs[j])>=0) return OCR_LABELS[i][0]; }
  return null;
}
function collectWords(data){
  if(!data) return [];
  if(data.words && data.words.length) return data.words;
  var out=[], blocks=data.blocks||[];
  blocks.forEach(function(b){ (b.paragraphs||[]).forEach(function(p){ (p.lines||[]).forEach(function(l){ (l.words||[]).forEach(function(w){ out.push(w); }); }); }); });
  return out;
}
function parseOCR(words){
  var ws=[];
  words.forEach(function(w){
    var txt=(w.text||"").trim(); if(!txt) return;
    if(w.confidence!=null && w.confidence<25) return;
    var b=w.bbox||{x0:0,y0:0,x1:0,y1:0};
    ws.push({ l:b.x0, w:b.x1-b.x0, cx:(b.x0+b.x1)/2, cy:(b.y0+b.y1)/2, h:(b.y1-b.y0), text:txt });
  });
  if(!ws.length) return {};
  var imgW=0, hs=[]; ws.forEach(function(w){ imgW=Math.max(imgW,w.l+w.w); hs.push(w.h); });
  hs.sort(function(a,b){ return a-b; }); var medH=hs[Math.floor(hs.length/2)]||20; var mid=imgW/2;
  ws.sort(function(a,b){ return a.cy-b.cy; });
  var rows=[], cur=[];
  ws.forEach(function(w){ if(cur.length && (w.cy-cur[cur.length-1].cy)>medH*0.8){ rows.push(cur); cur=[]; } cur.push(w); });
  if(cur.length) rows.push(cur);
  var seg=rows.map(function(r){ r.sort(function(a,b){ return a.l-b.l; });
    var L="",R=""; r.forEach(function(w){ if(w.cx<mid) L+=w.text; else R+=w.text; }); return [L,R]; });
  var res={};
  [0,1].forEach(function(col){
    var pending=null;
    seg.forEach(function(pair){ var s=pair[col]; if(!s) return;
      var lf=ocrLabel(s), n=ocrToNum(s);
      if(lf==="SKIP") pending="SKIP"; else if(lf) pending=lf;
      if(n && pending && pending!=="SKIP" && res[pending]==null){ res[pending]=n; pending=null; }
      else if(n && pending==="SKIP") pending=null;
    });
  });
  return res;
}
/* ---- table parser: AIの計算結果など「合計」列のある表から読む ---- */
function tblClean(raw){
  var t=normDigits(String(raw)).replace(/kcal/ig,"").replace(/g/ig,"");
  var m=t.replace(/\s/g,"").match(/\d[\d,]*\.?\d*/);
  return m?m[0].replace(/,/g,""):null;
}
function tblHasUnit(raw){ return /(kcal|g)\s*$/i.test(normDigits(String(raw))); }
var TBL_LABELS=[
  ["kcal",function(s){return s.indexOf("カロ")>=0;}],
  ["p",   function(s){return (/[Pp]/.test(s)&&s.length<=2)||s.indexOf("たん")>=0||s.indexOf("蛋")>=0;}],
  ["f",   function(s){return (/[Ff]/.test(s)&&s.length<=2)||s.indexOf("脂")>=0;}],
  ["c",   function(s){return s.indexOf("炭水")>=0||(/[Cc]/.test(s)&&s.length<=2);}],
  ["fiber",function(s){return s.indexOf("食物")>=0||s.indexOf("繊維")>=0;}]
];
function tblLabel(s){
  if(s.indexOf("糖質")>=0||s.indexOf("塩分")>=0) return "SKIP";
  for(var i=0;i<TBL_LABELS.length;i++) if(TBL_LABELS[i][1](s)) return TBL_LABELS[i][0];
  return null;
}
function parseTable(words){
  var ws=[];
  words.forEach(function(w){ var txt=(w.text||"").trim(); if(!txt) return; if(w.confidence!=null&&w.confidence<20) return;
    var b=w.bbox||{x0:0,y0:0,x1:0,y1:0}; ws.push({cx:(b.x0+b.x1)/2,cy:(b.y0+b.y1)/2,h:b.y1-b.y0,text:txt}); });
  if(!ws.length) return {};
  ws.sort(function(a,b){return a.cy-b.cy;});
  var hs=ws.map(function(w){return w.h;}).sort(function(a,b){return a-b;}); var medH=hs[Math.floor(hs.length/2)]||20;
  var rows=[],cr=[];
  ws.forEach(function(w){ if(cr.length&&(w.cy-cr[cr.length-1].cy)>medH*0.8){rows.push(cr);cr=[];} cr.push(w); });
  if(cr.length)rows.push(cr);
  var tableRows=[];
  rows.forEach(function(r){
    r.sort(function(a,b){return a.cx-b.cx;});
    var firstNumCx=Infinity;
    for(var i=0;i<r.length;i++){ if(tblClean(r[i].text)!=null){ firstNumCx=r[i].cx; break; } }
    var labelText=r.filter(function(w){ return tblClean(w.text)==null && w.cx<firstNumCx; }).map(function(w){return w.text;}).join("");
    var lf=tblLabel(labelText);
    if(!lf) return;
    var nums=r.filter(function(w){ return tblClean(w.text)!=null; }).map(function(w){ return {cx:w.cx,text:w.text,unit:tblHasUnit(w.text)}; });
    tableRows.push({field:lf,nums:nums});
  });
  var allNums=[]; tableRows.forEach(function(tr){ tr.nums.forEach(function(n){ allNums.push(n); }); });
  if(!allNums.length) return {};
  var xs=allNums.map(function(n){return n.cx;}).sort(function(a,b){return a-b;});
  var cols=[],c=[xs[0]];
  for(var i=1;i<xs.length;i++){ if(xs[i]-c[c.length-1]>80){ cols.push(c); c=[]; } c.push(xs[i]); }
  cols.push(c);
  var centers=cols.map(function(cc){ return cc.reduce(function(a,b){return a+b;},0)/cc.length; });
  var header=null; for(var i=0;i<ws.length;i++){ if(ws[i].text.indexOf("合計")>=0){ header=ws[i]; break; } }
  var target;
  if(header){ target=centers.reduce(function(best,x){ return Math.abs(x-header.cx)<Math.abs(best-header.cx)?x:best; },centers[0]); }
  else {
    var bi=-1,bs=-1;
    centers.forEach(function(center,idx){
      var inc=allNums.filter(function(n){return Math.abs(n.cx-center)<80;});
      var sc=inc.filter(function(n){return n.unit;}).length/(inc.length||1);
      if(sc>bs){bs=sc;bi=idx;}
    });
    target = bs>0 ? centers[bi] : (centers.length>=3?centers[2]:centers[centers.length-1]);
  }
  var res={};
  tableRows.forEach(function(tr){
    if(tr.field==="SKIP"||res[tr.field]!=null) return;
    var cand=tr.nums.filter(function(n){ return Math.abs(n.cx-target)<90; }).sort(function(a,b){ return Math.abs(a.cx-target)-Math.abs(b.cx-target); });
    if(cand.length){ var v=tblClean(cand[0].text); if(v!=null) res[tr.field]=v; }
  });
  return res;
}
function ocrOverlay(){
  var o=document.createElement("div"); o.className="ov"; o.id="ocrOv";
  o.innerHTML='<div class="ovCard"><div class="ovTitle">写真を読み取り中…</div><div class="ovBar"><div class="ovFill" id="ovFill"></div></div><div class="ovPct" id="ovPct">準備中…</div></div>';
  document.body.appendChild(o);
}
function ocrProgress(pct,label){ var f=document.getElementById("ovFill"), t=document.getElementById("ovPct"); if(f) f.style.width=pct+"%"; if(t) t.textContent=label; }
function ocrErr(msg){ var o=document.getElementById("ocrOv"); if(!o){ ocrOverlay(); o=document.getElementById("ocrOv"); }
  o.innerHTML='<div class="ovCard"><div class="ovTitle">読み取れませんでした</div><div class="ovErr">'+msg+'</div><button class="ovClose" id="ovCloseBtn">閉じる</button></div>';
  document.getElementById("ovCloseBtn").onclick=ocrClose;
}
function ocrClose(){ var o=document.getElementById("ocrOv"); if(o&&o.parentNode) o.parentNode.removeChild(o); }
function runOCR(file,mode){
  mode=mode||"summary";
  var targetW = mode==="table" ? 1200 : 1080;
  var parser  = mode==="table" ? parseTable : parseOCR;
  ocrOverlay();
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){
    URL.revokeObjectURL(url);
    var canvas; try{ canvas=preprocess(img,targetW); }catch(e){ ocrErr("画像を処理できませんでした。"); return; }
    ocrProgress(5,"文字認識エンジンを準備中…");
    var worker=null;
    loadTesseract().then(function(){
      return window.Tesseract.createWorker("jpn+eng",1,{ logger:function(m){
        if(m.status==="recognizing text") ocrProgress(12+Math.round((m.progress||0)*83),"読み取り中… "+Math.round((m.progress||0)*100)+"%");
        else ocrProgress(Math.min(11,Math.round((m.progress||0)*11)),"準備中…（初回は少し時間がかかります）");
      }});
    }).then(function(w){
      worker=w; ocrProgress(12,"読み取り中…");
      return worker.recognize(canvas,{},{ blocks:true });
    }).then(function(out){
      if(worker){ worker.terminate(); worker=null; }
      var words=collectWords(out&&out.data);
      var res=parser(words), got=0; for(var k in res) got++;
      if(got===0){ ocrErr(mode==="table"
        ? "表を読み取れませんでした。「合計」の列が入るように、表全体がはっきり写る範囲で撮り直してみてください。"
        : "数字を読み取れませんでした。栄養サマリーの数字がはっきり写るように、画面全体を撮り直してみてください。"); return; }
      ocrClose();
      for(var rk in res){ var rn=Number(res[rk]); if(!isNaN(rn)) res[rk]=String(Math.round(rn)); }
      pendingInput=res; ocrNote = mode==="table" ? (got>=4?"table":"table_partial") : (got>=4?"ok":"partial");
      saveMsg=""; saveCls=""; render();
      var el=document.getElementById("in_kcal"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    }).catch(function(e){ if(worker){ try{ worker.terminate(); }catch(_){} } ocrErr("読み取りに失敗しました。通信環境を確認して、もう一度お試しください。"); });
  };
  img.onerror=function(){ URL.revokeObjectURL(url); ocrErr("画像を開けませんでした。"); };
  img.src=url;
}
document.getElementById("ocrFile").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(f) runOCR(f,"summary");
});
document.getElementById("tblFile").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(f) runOCR(f,"table");
});

/* ---------- events ---------- */
document.getElementById("app").addEventListener("click",function(ev){
  var preset=ev.target.closest("[data-preset]");
  if(preset){ var n=Number(preset.getAttribute("data-preset")), t=new Date();
    document.getElementById("fStart").value=toISO(t);
    document.getElementById("fEnd").value=toISO(addDays(t,n-1)); updateCalc(); return; }
  var btn=ev.target.closest("[data-act]");
  if(btn){ var a=btn.getAttribute("data-act");
    if(a==="saveEntry") saveEntry();
    else if(a==="saveSettings") saveSettings();
    else if(a==="openSettings"){ settingsOpen=true; render(); }
    else if(a==="cancelSettings"){ settingsOpen=false; render(); }
    else if(a==="dismiss"){ rolledCount=0; render(); }
    else if(a==="toggleHist"){ showHistory=!showHistory; render(); }
    else if(a==="export") exportData();
    else if(a==="import") document.getElementById("importFile").click();
    else if(a==="ocr") document.getElementById("ocrFile").click();
    else if(a==="ocrTable") document.getElementById("tblFile").click();
    return; }
  var day=ev.target.closest("[data-iso]");
  if(day){ selDate=day.getAttribute("data-iso"); saveMsg=""; saveCls=""; pendingInput=null; ocrNote=""; render(); }
});
document.getElementById("app").addEventListener("input",function(ev){
  if(ev.target.id&&ev.target.id.indexOf("avg_")===0) updateCalc();
  if(ev.target.id==="fStart"||ev.target.id==="fEnd") updateCalc();
});
document.getElementById("app").addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id&&ev.target.id.indexOf("in_")===0){ ev.preventDefault(); saveEntry(); }
});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && state.config){ var r=rollForward(); if(r>0){ rolledCount=r; writeState(); render(); } }
});

/* ---------- boot ---------- */
storageOk=probeStorage();
var loaded=readState(KEY);
if(!loaded){
  var old=readState(OLD_KEY);
  if(old&&old.config){
    var days=diffDays(parseISO(old.config.startDate),parseISO(old.config.endDate))+1;
    var avg={ kcal:old.config.avgKcal?Number(old.config.avgKcal):0, p:old.config.avgProtein?Number(old.config.avgProtein):0, f:0, c:0, fiber:0 };
    loaded={ config:{ startDate:old.config.startDate, endDate:old.config.endDate, avg:avg }, entries:old.entries||{}, history:[] };
  }
}
if(loaded&&loaded.config){
  state={ config:loaded.config, entries:loaded.entries||{}, history:loaded.history||[] };
  if(!state.config.avg) state.config.avg={};
  rolledCount=rollForward();
  if(rolledCount>0) writeState();
}
render();
</script>
