<style>
:root{
  --paper:#EDF1EE; --card:#FBFCFB; --ink:#18211D; --soft:#5E6B64;
  --line:#DCE3DF; --green:#2E7D5B; --green-bg:#E4F0EA;
  --over:#BB4A32; --over-bg:#F7E7E1; --amber:#B07A26; --amber-bg:#F3ECDB;
  --pro:#3D5C8C; --pro-bg:#E4EAF3;
}
*{ -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--paper); }
body{
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Hiragino Sans","Segoe UI",sans-serif;
  color:var(--ink);
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-text-size-adjust:100%;
}
.mono{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
.wrap{ max-width:520px; margin:0 auto; }
button{ font-family:inherit; }
button:focus-visible, input:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

.top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; gap:10px; }
.period{ font-size:13px; color:var(--soft); }
.period b{ color:var(--ink); font-weight:600; }
.gear{ border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:9px; padding:6px 12px; font-size:12px; cursor:pointer; flex-shrink:0; }

.banner{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--green-bg); color:var(--green); border-radius:11px;
  padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.5; }
.bx{ border:none; background:transparent; color:var(--green); font-size:16px;
  cursor:pointer; padding:0 2px; line-height:1; flex-shrink:0; }
.warn{ background:var(--over-bg); color:var(--over); border-radius:11px;
  padding:12px 14px; font-size:12.5px; margin-bottom:12px; line-height:1.6; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:20px; margin-bottom:12px; }
.heroLabel{ font-size:12px; color:var(--soft); letter-spacing:.06em; }
.hero{ display:flex; align-items:baseline; gap:8px; margin-top:4px; }
.heroNum{ font-size:42px; font-weight:600; line-height:1; }
.heroNum.sm{ font-size:34px; }
.heroUnit{ font-size:15px; color:var(--soft); }
.pill{ display:inline-block; margin-top:12px; font-size:12.5px; font-weight:600;
  padding:4px 11px; border-radius:20px; }
.meter{ margin-top:16px; }
.track{ position:relative; height:12px; border-radius:7px; background:var(--paper);
  border:1px solid var(--line); overflow:hidden; }
.fill{ position:absolute; left:0; top:0; bottom:0; border-radius:7px 0 0 7px; transition:width .35s ease; }
.marker{ position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); }
.mcap{ position:absolute; top:-13px; transform:translateX(-50%); font-size:9.5px; white-space:nowrap; }
.mlabel{ display:flex; justify-content:space-between; margin-top:9px; font-size:11px; color:var(--soft); gap:8px; }
.pace{ font-size:12px; color:var(--soft); margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
.pace b{ color:var(--ink); font-weight:600; }
.muted{ font-size:13px; color:var(--soft); margin-top:12px; line-height:1.6; }

.stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:12px; }
.stat{ background:var(--card); padding:14px 10px; text-align:center; }
.statNum{ font-size:19px; font-weight:600; }
.statLbl{ font-size:10.5px; color:var(--soft); margin-top:3px; line-height:1.4; }

.h{ font-size:13px; font-weight:600; color:var(--soft); margin:22px 2px 10px; }
.hrow{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 10px; }
.hrow .h{ margin:0; }
.toggle{ border:none; background:transparent; color:var(--soft); font-size:12px;
  cursor:pointer; text-decoration:underline; padding:0; }

.daysel{ font-size:13px; color:var(--soft); margin:2px 0 10px; }
.daysel b{ color:var(--ink); }
.fields{ display:flex; gap:8px; }
.fwrap{ flex:1; min-width:0; }
.flab{ font-size:11px; color:var(--soft); margin-bottom:5px; }
.field{ width:100%; border:1px solid var(--line); border-radius:11px; background:var(--card);
  padding:12px 13px; font-size:20px; color:var(--ink); outline:none; box-sizing:border-box; }
.field:focus{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.saveBtn{ width:100%; border:none; background:var(--ink); color:#fff; border-radius:11px;
  padding:14px; font-size:15px; font-weight:600; cursor:pointer; margin-top:9px; }
.saveState{ font-size:11.5px; margin-top:8px; text-align:center; min-height:16px; color:var(--soft); }
.saveState.ok{ color:var(--green); }
.saveState.bad{ color:var(--over); font-weight:600; }

.day{ display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:11px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card);
  margin-bottom:7px; cursor:pointer; }
.day.sel{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.day.today .dDate{ font-weight:700; }
.dDate{ font-size:14px; flex-shrink:0; }
.dTag{ font-size:10px; color:var(--green); background:var(--green-bg); padding:2px 7px; border-radius:10px; margin-left:8px; }
.dVals{ display:flex; gap:12px; align-items:baseline; }
.dK{ font-size:15px; font-weight:600; }
.dP{ font-size:13px; color:var(--pro); font-weight:600; }
.dEmpty{ color:#B7C0BA; font-size:14px; }

.hist{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:13px 14px; margin-bottom:8px; }
.histTop{ display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  font-size:13px; color:var(--soft); }
.histRow{ margin-top:10px; }
.histLbl{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--soft); margin-bottom:5px; gap:8px; }
.histLbl b{ font-weight:600; color:var(--ink); }
.histBar{ height:6px; border-radius:4px; background:var(--paper); border:1px solid var(--line);
  overflow:hidden; position:relative; }
.histFill{ position:absolute; left:0; top:0; bottom:0; border-radius:4px 0 0 4px; }

.set label{ display:block; font-size:12px; color:var(--soft); margin:14px 0 6px; }
.set input{ width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:11px;
  padding:12px 14px; font-size:16px; color:var(--ink); background:var(--card); outline:none; }
.set input:focus{ border-color:var(--green); box-shadow:0 0 0 3px var(--green-bg); }
.calc{ font-size:11.5px; color:var(--soft); margin-top:7px; min-height:16px; }
.calc b{ color:var(--ink); font-weight:600; }
.presets{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.preset{ border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:20px; padding:8px 14px; font-size:12.5px; cursor:pointer; }
.note{ font-size:11.5px; color:var(--soft); line-height:1.6; margin-top:16px; }
.actions{ display:flex; gap:8px; margin-top:20px; }
.btnMain{ flex:1; border:none; background:var(--ink); color:#fff; border-radius:11px;
  padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
.btnGhost{ border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:11px; padding:14px 18px; font-size:15px; cursor:pointer; }
.backup{ display:flex; gap:8px; margin-top:12px; }
.backup button{ flex:1; border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:11px; padding:11px; font-size:12.5px; cursor:pointer; }

.intro{ text-align:center; padding:12px 4px 4px; }
.intro h1{ font-size:22px; margin:0 0 6px; }
.intro p{ font-size:14px; color:var(--soft); line-height:1.6; margin:0 0 4px; }
.hint{ font-size:11.5px; color:var(--soft); text-align:center; margin-top:16px; line-height:1.6; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
"use strict";

/* ---------- dates ---------- */
function parseISO(s){ var a=s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function toISO(d){
  var m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function stripTime(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((stripTime(b)-stripTime(a))/86400000); }
function fmtJP(d){
  var w=["日","月","火","水","木","金","土"][d.getDay()];
  return (d.getMonth()+1)+"/"+d.getDate()+"（"+w+"）";
}
function fmtShort(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
function fmtNum(n){ return Math.round(n).toLocaleString("ja-JP"); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function normEntry(v){
  if(v==null) return null;
  if(typeof v==="number") return {k:v,p:null};
  return { k: v.k!=null?v.k:null, p: v.p!=null?v.p:null };
}

/* ---------- storage ---------- */
var KEY="calorie-ledger-v3";
var storageOk=true;

function probeStorage(){
  try{
    localStorage.setItem("__probe__","1");
    localStorage.removeItem("__probe__");
    return true;
  }catch(e){ return false; }
}
function readState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function writeState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    return localStorage.getItem(KEY)!=null;   // read back to confirm
  }catch(e){
    console.error("save failed", e);
    return false;
  }
}

/* ---------- period logic ---------- */
function targetsFor(cfg,days){
  return { kcal:(Number(cfg.avgKcal)||0)*days, protein:(Number(cfg.avgProtein)||0)*days };
}
function summarize(cfg,entries){
  var s=parseISO(cfg.startDate);
  var days=diffDays(s,parseISO(cfg.endDate))+1;
  var kcal=0,protein=0,entered=0;
  for(var i=0;i<days;i++){
    var e=normEntry(entries[toISO(addDays(s,i))]);
    if(e){
      kcal+=Number(e.k)||0; protein+=Number(e.p)||0;
      if((Number(e.k)||0)>0||(Number(e.p)||0)>0) entered++;
    }
  }
  var t=targetsFor(cfg,days);
  return { startDate:cfg.startDate, endDate:cfg.endDate, days:days,
           kcal:kcal, protein:protein, entered:entered,
           targetKcal:t.kcal, targetProtein:t.protein };
}
function rollForward(){
  var today=stripTime(new Date()), rolled=0;
  while(state.config && parseISO(state.config.endDate)<today && rolled<400){
    state.history.unshift(summarize(state.config,state.entries));
    var len=diffDays(parseISO(state.config.startDate),parseISO(state.config.endDate))+1;
    var ns=addDays(parseISO(state.config.endDate),1);
    state.config={ startDate:toISO(ns), endDate:toISO(addDays(ns,len-1)),
                   avgKcal:state.config.avgKcal, avgProtein:state.config.avgProtein };
    rolled++;
  }
  return rolled;
}

/* ---------- app state ---------- */
var state={config:null,entries:{},history:[]};
var rolledCount=0, showHistory=false, settingsOpen=false;
var selDate=toISO(new Date()), saveMsg="", saveCls="";

/* ---------- setup screen ---------- */
function renderSetup(){
  var today=toISO(new Date());
  var c=state.config;
  var s=c?c.startDate:today;
  var e=c?c.endDate:toISO(addDays(new Date(),6));
  var ak=c&&c.avgKcal?c.avgKcal:"";
  var ap=c&&c.avgProtein?c.avgProtein:"";

  var html="";
  if(!storageOk) html+='<div class="warn"><b>データを保存できません。</b><br>'+
    'この画面を閉じると入力内容は消えます。Safariのプライベートブラウズを使っている場合は、'+
    '通常のタブで開き直してください。</div>';
  if(!c) html+='<div class="intro"><h1>カロリー家計簿</h1>'+
    '<p>期間と、1日あたりの目標を決めましょう。</p>'+
    '<p>毎日の合計を入力すれば、累計とペースが見えます。</p></div>';
  else html+='<div class="h" style="margin:4px 2px 0">設定</div>';

  html+='<label for="fStart">期間の開始日</label>'+
        '<input type="date" id="fStart" value="'+s+'">'+
        '<label for="fEnd">期間の終了日</label>'+
        '<input type="date" id="fEnd" value="'+e+'">'+
        '<div class="presets">'+
          '<button class="preset" data-preset="7">今日から1週間</button>'+
          '<button class="preset" data-preset="14">2週間</button>'+
          '<button class="preset" data-preset="30">1ヶ月</button>'+
        '</div>'+
        '<label for="fAvgK">1日の平均カロリー（上限の目安）</label>'+
        '<input type="number" inputmode="numeric" id="fAvgK" placeholder="例：2000" value="'+ak+'">'+
        '<div class="calc" id="calcK"></div>'+
        '<label for="fAvgP">1日の平均タンパク質（下限の目安・g）</label>'+
        '<input type="number" inputmode="numeric" id="fAvgP" placeholder="例：120" value="'+ap+'">'+
        '<div class="calc" id="calcP"></div>'+
        '<div class="note" id="setNote"></div>'+
        '<div class="actions">'+
          '<button class="btnMain" data-act="saveSettings">保存する</button>'+
          (c?'<button class="btnGhost" data-act="cancelSettings">やめる</button>':'')+
        '</div>';

  if(c) html+='<div class="h" style="margin-top:26px">データの控え</div>'+
    '<div class="backup">'+
      '<button data-act="export">書き出す</button>'+
      '<button data-act="import">読み込む</button>'+
    '</div>'+
    '<div class="note">Safariの履歴やデータを消すと記録も消えます。'+
    'ときどき書き出してファイルに残しておくと安心です。</div>';

  document.getElementById("app").className="wrap set";
  document.getElementById("app").innerHTML=html;
  updateCalc();
}

function draftDays(){
  var s=document.getElementById("fStart").value, e=document.getElementById("fEnd").value;
  if(!s||!e) return 0;
  if(parseISO(e)<parseISO(s)) return -1;
  return diffDays(parseISO(s),parseISO(e))+1;
}
function updateCalc(){
  var d=draftDays();
  var ak=Number(document.getElementById("fAvgK").value)||0;
  var ap=Number(document.getElementById("fAvgP").value)||0;
  document.getElementById("calcK").innerHTML =
    (d>0&&ak)? d+"日間の合計目標：<b class='mono'>"+fmtNum(ak*d)+" kcal</b>" : "";
  document.getElementById("calcP").innerHTML =
    (d>0&&ap)? d+"日間の合計目標：<b class='mono'>"+fmtNum(ap*d)+" g</b>" : "";
  document.getElementById("setNote").textContent =
    d<0 ? "終了日は開始日より後にしてください。"
        : "この期間は"+d+"日間です。終わると同じ長さの期間が自動で始まり、前の期間は履歴に残ります。"+
          "カロリーは超えないよう、タンパク質は届くように追いかけます。";
}

/* ---------- main screen ---------- */
function meterHTML(frac,color,timeFrac,showMarker){
  var h='<div class="track"><div class="fill" style="width:'+(frac*100)+'%;background:'+color+'"></div>';
  if(showMarker){
    h+='<div class="marker" style="left:'+(timeFrac*100)+'%"></div>'+
       '<div class="mcap" style="left:'+(timeFrac*100)+'%">今日の目安</div>';
  }
  return h+'</div>';
}

function renderMain(){
  var cfg=state.config;
  var start=parseISO(cfg.startDate), end=parseISO(cfg.endDate);
  var todayISO=toISO(new Date()), today=stripTime(new Date());
  var periodDays=diffDays(start,end)+1;

  var elapsed = today<start ? 0 : (today>end ? periodDays : diffDays(start,today)+1);
  var remainDays=Math.max(periodDays-elapsed,0);

  var sumK=0,sumP=0,enteredDays=0,days=[];
  for(var i=0;i<periodDays;i++){
    var d=addDays(start,i), iso=toISO(d), e=normEntry(state.entries[iso]);
    if(e){
      sumK+=Number(e.k)||0; sumP+=Number(e.p)||0;
      if((Number(e.k)||0)>0||(Number(e.p)||0)>0) enteredDays++;
    }
    days.push({iso:iso,date:d,e:e});
  }

  var t=targetsFor(cfg,periodDays), tK=t.kcal, tP=t.protein;
  var timeFrac=periodDays?Math.min(elapsed/periodDays,1):0;
  var showMarker = elapsed>0 && elapsed<periodDays;

  /* calories = ceiling */
  var kFrac=tK?Math.min(sumK/tK,1):0;
  var kOver=tK&&sumK>tK, kFast=tK&&kFrac>timeFrac&&!kOver;
  var kColor="var(--green)", kText="ペース内で順調です", kPill="background:var(--green-bg);color:var(--green)";
  if(kOver){ kColor="var(--over)"; kText="目標を超えています"; kPill="background:var(--over-bg);color:var(--over)"; }
  else if(kFast){ kColor="var(--amber)"; kText="ペースがやや速めです"; kPill="background:var(--amber-bg);color:var(--amber)"; }
  var kPace=(tK&&remainDays>0)?(tK-sumK)/remainDays:null;

  /* protein = floor */
  var pFrac=tP?Math.min(sumP/tP,1):0;
  var pDone=tP&&sumP>=tP, pBehind=tP&&pFrac<timeFrac&&!pDone;
  var pColor="var(--pro)", pText="ペース内で順調です", pPill="background:var(--pro-bg);color:var(--pro)";
  if(pDone){ pColor="var(--green)"; pText="目標を達成しました"; pPill="background:var(--green-bg);color:var(--green)"; }
  else if(pBehind){ pColor="var(--amber)"; pText="やや不足しています"; pPill="background:var(--amber-bg);color:var(--amber)"; }
  var pPace=(tP&&remainDays>0)?Math.max((tP-sumP)/remainDays,0):null;

  var h="";
  h+='<div class="top"><div class="period"><b>'+fmtJP(start)+'</b> → <b>'+fmtJP(end)+
     '</b> ・全'+periodDays+'日</div>'+
     '<button class="gear" data-act="openSettings">設定</button></div>';

  if(!storageOk) h+='<div class="warn"><b>データを保存できません。</b><br>'+
    'この画面を閉じると入力内容は消えます。Safariのプライベートブラウズを使っている場合は、'+
    '通常のタブで開き直してください。</div>';

  if(rolledCount>0) h+='<div class="banner"><span>新しい期間が始まりました。'+
    (rolledCount===1?"前の期間":"前の"+rolledCount+"期間")+'は履歴に残しています。</span>'+
    '<button class="bx" data-act="dismiss" aria-label="閉じる">×</button></div>';

  /* calorie card */
  h+='<div class="card"><div class="heroLabel">'+(tK?"カロリー・残り":"カロリー・累計")+'</div>'+
     '<div class="hero"><span class="heroNum mono"'+(kOver?' style="color:var(--over)"':'')+'>'+
     (tK?fmtNum(Math.abs(tK-sumK)):fmtNum(sumK))+'</span>'+
     '<span class="heroUnit">'+((tK&&sumK>tK)?"kcal 超過":"kcal")+'</span></div>';
  if(tK){
    h+='<span class="pill" style="'+kPill+'">'+kText+'</span>'+
       '<div class="meter">'+meterHTML(kFrac,kColor,timeFrac,showMarker)+
       '<div class="mlabel"><span class="mono">'+fmtNum(sumK)+' 摂取</span>'+
       '<span class="mono">目標 '+fmtNum(tK)+'</span></div></div>';
    if(kPace!=null) h+='<div class="pace">残り'+remainDays+'日、1日あたり <b class="mono">'+
       fmtNum(Math.max(kPace,0))+' kcal</b> まで</div>';
  } else {
    h+='<div class="muted">設定で1日の平均カロリーを入れると、残りとペースが表示されます。</div>';
  }
  h+='</div>';

  /* protein card */
  h+='<div class="card"><div class="heroLabel">'+(tP?"タンパク質・あと":"タンパク質・累計")+'</div>'+
     '<div class="hero"><span class="heroNum sm mono"'+(pDone?' style="color:var(--green)"':'')+'>'+
     (tP?fmtNum(Math.max(tP-sumP,0)):fmtNum(sumP))+'</span><span class="heroUnit">g</span></div>';
  if(tP){
    h+='<span class="pill" style="'+pPill+'">'+pText+'</span>'+
       '<div class="meter">'+meterHTML(pFrac,pColor,timeFrac,showMarker)+
       '<div class="mlabel"><span class="mono">'+fmtNum(sumP)+' g 摂取</span>'+
       '<span class="mono">目標 '+fmtNum(tP)+' g</span></div></div>';
    if(pPace!=null) h+='<div class="pace">残り'+remainDays+'日、1日あたり <b class="mono">'+
       fmtNum(pPace)+' g</b> 必要</div>';
  } else {
    h+='<div class="muted">設定で1日の平均タンパク質を入れると、達成状況が表示されます。</div>';
  }
  h+='</div>';

  /* stats */
  h+='<div class="stats">'+
     '<div class="stat"><div class="statNum mono">'+elapsed+
     '<span style="font-size:13px;color:var(--soft)">/'+periodDays+'</span></div>'+
     '<div class="statLbl">経過日数</div></div>'+
     '<div class="stat"><div class="statNum mono">'+(enteredDays?fmtNum(sumK/enteredDays):"—")+
     '</div><div class="statLbl">1日平均<br>kcal</div></div>'+
     '<div class="stat"><div class="statNum mono">'+(enteredDays?fmtNum(sumP/enteredDays):"—")+
     '</div><div class="statLbl">1日平均<br>タンパク質 g</div></div></div>';

  /* input */
  var sel=normEntry(state.entries[selDate]);
  h+='<div class="h">入力する</div>'+
     '<div class="daysel">対象の日：<b>'+fmtJP(parseISO(selDate))+'</b>'+
     (selDate===todayISO?" ・今日":"")+'</div>'+
     '<div class="fields">'+
       '<div class="fwrap"><div class="flab">カロリー（kcal）</div>'+
       '<input class="field mono" type="number" inputmode="numeric" id="inK" placeholder="0" value="'+
       (sel&&sel.k!=null?sel.k:"")+'"></div>'+
       '<div class="fwrap"><div class="flab">タンパク質（g）</div>'+
       '<input class="field mono" type="number" inputmode="numeric" id="inP" placeholder="0" value="'+
       (sel&&sel.p!=null?sel.p:"")+'"></div>'+
     '</div>'+
     '<button class="saveBtn" data-act="saveEntry">保存</button>'+
     '<div class="saveState '+saveCls+'">'+esc(saveMsg)+'</div>';

  /* day list */
  h+='<div class="h">この期間の記録</div>';
  days.forEach(function(d){
    var cls="day"+(d.iso===selDate?" sel":"")+(d.iso===todayISO?" today":"");
    h+='<div class="'+cls+'" data-iso="'+d.iso+'">'+
       '<div class="dDate">'+fmtJP(d.date)+
       (d.iso===todayISO?'<span class="dTag">今日</span>':'')+'</div>';
    if(d.e){
      h+='<div class="dVals"><span class="dK mono">'+
         (d.e.k!=null?fmtNum(d.e.k)+" kcal":"— kcal")+'</span>'+
         '<span class="dP mono">'+(d.e.p!=null?fmtNum(d.e.p)+" g":"— g")+'</span></div>';
    } else {
      h+='<span class="dEmpty">未入力</span>';
    }
    h+='</div>';
  });

  /* history */
  if(state.history.length){
    h+='<div class="hrow"><div class="h">これまでの期間（'+state.history.length+'）</div>'+
       '<button class="toggle" data-act="toggleHist">'+(showHistory?"隠す":"見る")+'</button></div>';
    if(showHistory){
      state.history.forEach(function(x){
        var kO=x.targetKcal&&x.kcal>x.targetKcal;
        var kF=x.targetKcal?Math.min(x.kcal/x.targetKcal,1):0;
        var pD=x.targetProtein&&x.protein>=x.targetProtein;
        var pF=x.targetProtein?Math.min(x.protein/x.targetProtein,1):0;
        h+='<div class="hist"><div class="histTop">'+
           '<span class="mono">'+fmtShort(parseISO(x.startDate))+'–'+fmtShort(parseISO(x.endDate))+'</span>'+
           '<span class="mono">'+x.entered+'/'+x.days+'日入力</span></div>';
        if(x.targetKcal>0){
          h+='<div class="histRow"><div class="histLbl mono">'+
             '<span>カロリー <b>'+fmtNum(x.kcal)+'</b> / '+fmtNum(x.targetKcal)+'</span>'+
             '<span style="color:'+(kO?"var(--over)":"var(--green)")+'">'+
             (kO?fmtNum(x.kcal-x.targetKcal)+" 超過":fmtNum(x.targetKcal-x.kcal)+" 残")+'</span></div>'+
             '<div class="histBar"><div class="histFill" style="width:'+(kF*100)+
             '%;background:'+(kO?"var(--over)":"var(--green)")+'"></div></div></div>';
        }
        if(x.targetProtein>0){
          h+='<div class="histRow"><div class="histLbl mono">'+
             '<span>タンパク質 <b>'+fmtNum(x.protein)+'</b> / '+fmtNum(x.targetProtein)+' g</span>'+
             '<span style="color:'+(pD?"var(--green)":"var(--amber)")+'">'+
             (pD?"達成":fmtNum(x.targetProtein-x.protein)+" 不足")+'</span></div>'+
             '<div class="histBar"><div class="histFill" style="width:'+(pF*100)+
             '%;background:'+(pD?"var(--green)":"var(--amber)")+'"></div></div></div>';
        }
        h+='</div>';
      });
    }
  }

  h+='<div class="hint">日付をタップするとその日を編集できます。<br>'+
     fmtJP(addDays(end,1))+'から、次の'+periodDays+'日間が自動で始まります。</div>';

  document.getElementById("app").className="wrap";
  document.getElementById("app").innerHTML=h;
}

function render(){
  if(!state.config||settingsOpen) renderSetup();
  else renderMain();
}

/* ---------- actions ---------- */
function flash(msg,cls){
  saveMsg=msg; saveCls=cls;
  render();
  if(cls==="ok") setTimeout(function(){ saveMsg=""; saveCls=""; render(); },2000);
}

function saveEntry(){
  var k=document.getElementById("inK").value.trim();
  var p=document.getElementById("inP").value.trim();
  if(k==="" && p==="") delete state.entries[selDate];
  else state.entries[selDate]={ k:k===""?null:Number(k), p:p===""?null:Number(p) };
  var ok=writeState();
  storageOk=ok;
  flash(ok?"保存しました":"保存できませんでした。閉じると消えます。", ok?"ok":"bad");
}

function saveSettings(){
  var s=document.getElementById("fStart").value, e=document.getElementById("fEnd").value;
  if(!s||!e||parseISO(e)<parseISO(s)){ updateCalc(); return; }
  state.config={
    startDate:s, endDate:e,
    avgKcal:Number(document.getElementById("fAvgK").value)||0,
    avgProtein:Number(document.getElementById("fAvgP").value)||0
  };
  storageOk=writeState();
  settingsOpen=false;
  selDate=toISO(new Date());
  saveMsg=""; saveCls="";
  render();
}

function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="calorie-ledger-"+toISO(new Date())+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

document.getElementById("importFile").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!d.config) throw new Error("形式が違います");
      state={ config:d.config, entries:d.entries||{}, history:d.history||[] };
      rolledCount=rollForward();
      storageOk=writeState();
      settingsOpen=false;
      render();
    }catch(err){
      alert("読み込めませんでした。書き出したファイルを選んでください。");
    }
  };
  r.readAsText(f);
  ev.target.value="";
});

/* ---------- events ---------- */
document.getElementById("app").addEventListener("click",function(ev){
  var preset=ev.target.closest("[data-preset]");
  if(preset){
    var n=Number(preset.getAttribute("data-preset"));
    var t=new Date();
    document.getElementById("fStart").value=toISO(t);
    document.getElementById("fEnd").value=toISO(addDays(t,n-1));
    updateCalc();
    return;
  }
  var btn=ev.target.closest("[data-act]");
  if(btn){
    var a=btn.getAttribute("data-act");
    if(a==="saveEntry") saveEntry();
    else if(a==="saveSettings") saveSettings();
    else if(a==="openSettings"){ settingsOpen=true; render(); }
    else if(a==="cancelSettings"){ settingsOpen=false; render(); }
    else if(a==="dismiss"){ rolledCount=0; render(); }
    else if(a==="toggleHist"){ showHistory=!showHistory; render(); }
    else if(a==="export") exportData();
    else if(a==="import") document.getElementById("importFile").click();
    return;
  }
  var day=ev.target.closest("[data-iso]");
  if(day){ selDate=day.getAttribute("data-iso"); saveMsg=""; saveCls=""; render(); }
});

document.getElementById("app").addEventListener("input",function(ev){
  if(["fStart","fEnd","fAvgK","fAvgP"].indexOf(ev.target.id)>=0) updateCalc();
});

document.getElementById("app").addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&(ev.target.id==="inK"||ev.target.id==="inP")){
    ev.preventDefault(); saveEntry();
  }
});

/* re-check the period when coming back to the app */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden && state.config){
    var r=rollForward();
    if(r>0){ rolledCount=r; writeState(); render(); }
  }
});

/* ---------- boot ---------- */
storageOk=probeStorage();
var loadedState=readState();
if(loadedState&&loadedState.config){
  state={ config:loadedState.config, entries:loadedState.entries||{}, history:loadedState.history||[] };
  rolledCount=rollForward();
  if(rolledCount>0) writeState();
}
render();
</script>
</body>
</html>
